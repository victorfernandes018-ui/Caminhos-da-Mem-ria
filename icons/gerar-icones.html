<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Gerar ícones</title></head>
<body>
<canvas id="c"></canvas>
<div id="links"></div>
<script>
const sizes = [72, 96, 128, 192, 512];
const links = document.getElementById('links');

sizes.forEach(size => {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Fundo azul-marinho
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#0F2742');
    grad.addColorStop(1, '#1E3A5F');
    ctx.fillStyle = grad;
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    // Borda dourada sutil
    ctx.strokeStyle = '#C9A961';
    ctx.lineWidth = size * 0.025;
    ctx.stroke();

    // Letras "CM"
    ctx.fillStyle = 'white';
    ctx.font = `bold ${size * 0.38}px Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CM', size / 2, size / 2);

    // Link para download
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = `icon-${size}.png`;
    a.textContent = `Baixar icon-${size}.png`;
    a.style.display = 'block';
    links.appendChild(a);
});

// Clica em todos automaticamente
setTimeout(() => {
    links.querySelectorAll('a').forEach(a => a.click());
}, 500);
</script>
</body>
</html>
