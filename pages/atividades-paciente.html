<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades — Caminhos da Memória</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#1E3A5F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/paciente.css">
</head>
<body class="modo-paciente">

    <div class="paciente-wrap">

        <header class="paciente-header">
            <span class="paciente-logo">Caminhos da Memória</span>
            <a href="modo.html" class="btn-modo-cuidador">Trocar usuário</a>
        </header>

        <a href="paciente.html" class="btn-voltar-paciente">← Voltar</a>

        <!-- Progresso -->
        <div class="atividade-progresso" id="progresso-wrap" style="display:none;">
            <div class="atividade-prog-barra">
                <div class="atividade-prog-fill" id="prog-fill" style="width:0%"></div>
            </div>
            <span class="atividade-prog-texto" id="prog-texto">0 / 0</span>
        </div>

        <!-- Atividade em curso -->
        <div id="atividade-area"></div>

        <!-- Tela de início -->
        <div id="inicio-area">
            <h1 class="paciente-titulo">Vamos brincar?</h1>
            <p class="paciente-subtitulo">Uma atividade gentil com as suas fotos</p>

            <div class="atividade-card">
                <div style="font-size:64px; margin-bottom:20px;">🧩</div>
                <p style="font-size:19px; color:#4A5568; margin-bottom:28px;">
                    Vou mostrar fotos das pessoas que você ama.<br>
                    Sem pressa, sem pontuação.<br>
                    Pode pular quando quiser.
                </p>
                <button onclick="iniciarAtividade()" style="width:100%; background:#1E3A5F; color:white; border:none; padding:20px; border-radius:14px; font-size:22px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; box-shadow:0 4px 16px rgba(30,58,95,0.25);">
                    Vamos começar ✨
                </button>
            </div>
        </div>

        <!-- Tela de fim -->
        <div id="fim-area" style="display:none;">
            <div class="atividade-card atividade-fim">
                <div class="atividade-fim-icone">🌟</div>
                <div class="atividade-fim-titulo">Muito bem!</div>
                <div class="atividade-fim-subtitulo">Foi um prazer brincar com você hoje.</div>
                <button onclick="reiniciarAtividade()" style="width:100%; background:#1E3A5F; color:white; border:none; padding:18px; border-radius:14px; font-size:20px; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; margin-bottom:14px;">
                    Jogar de novo
                </button>
                <a href="paciente.html" style="display:block; text-align:center; color:#4A6FA5; font-size:18px; font-weight:600; text-decoration:none; padding:12px;">
                    Voltar para o início
                </a>
            </div>
        </div>

    </div>

    <script src="../js/main.js"></script>
    <script src="../js/atividades-paciente.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
